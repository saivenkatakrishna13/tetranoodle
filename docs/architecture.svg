<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="790" viewBox="0 0 1400 790"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m0 0 10 5-10 5z" fill="#789189"/></marker><style>text{font-family:Arial,sans-serif;fill:#18372e}.title{font-size:34px;font-weight:700}.sub{font-size:16px;fill:#6e8179}.name{font-size:23px;font-weight:600}.body{font-size:14px;fill:#637b70}.label{font-size:12px;fill:#6a8276}.line{fill:none;stroke:#789189;stroke-width:2;marker-end:url(#arrow)}.box{fill:white;stroke:#d9e6df;stroke-width:1.5}</style></defs><rect width="1400" height="790" fill="#f5f8f4"/><text x="65" y="70" class="title">TetraNoodle · Five specialists, one next chapter.</text><text x="65" y="104" class="sub">Live research. Evidence-grounded decisions. One focused question at a time.</text><rect x="65" y="149" width="280" height="143" rx="15" class="box"/><text x="88" y="181" class="name">Student workspace</text><text x="88" y="211" class="body">WhatsApp-style React group chat</text><text x="88" y="237" class="body">Profile · resume · transcript · GitHub</text><text x="88" y="263" class="body">Start / pause / resume research</text><rect x="425" y="149" width="280" height="143" rx="15" fill="#e2f1e8" stroke="#bbd9c8"/><text x="448" y="181" class="name">Mira · coordinator</text><text x="448" y="211" class="body">Chooses the next relevant speaker</text><text x="448" y="237" class="body">Routes work and reviews the result</text><text x="448" y="263" class="body">Asks one clear follow-up</text><path d="M345 220h77" class="line"/><rect x="837" y="149" width="488" height="143" rx="15" class="box"/><text x="860" y="181" class="name">Private persistent workspace</text><text x="860" y="211" class="body">Profile + document text + full source evidence</text><text x="860" y="237" class="body">Replayable SSE events + saved job checkpoints</text><text x="860" y="263" class="body">Survives refreshes; resumes after server restarts</text><path d="M705 220h130" class="line"/><text x="733" y="207" class="label">saved state</text><path d="M565 292v53H202v34" class="line"/><rect x="65" y="381" width="274" height="155" rx="15" class="box"/><circle cx="94" cy="411" r="12" fill="#f3e3d4"/><text x="116" y="420" class="name">Arjun · profile</text><text x="88" y="453" class="body">Extracts supported student facts</text><text x="88" y="480" class="body">Reads supplied public profiles</text><text x="88" y="507" class="body">Separates unknowns from evidence</text><rect x="394" y="381" width="274" height="155" rx="15" class="box"/><circle cx="423" cy="411" r="12" fill="#e4e6f7"/><text x="445" y="420" class="name">Nova · discovery</text><text x="417" y="453" class="body">Searches real public opportunities</text><text x="417" y="480" class="body">Keeps actual search-receipt URLs</text><text x="417" y="507" class="body">Replaces failed or unsuitable leads</text><rect x="723" y="381" width="274" height="155" rx="15" class="box"/><circle cx="752" cy="411" r="12" fill="#f2dfe7"/><text x="774" y="420" class="name">Sage · verification</text><text x="746" y="453" class="body">Reads official pages with Scrapling</text><text x="746" y="480" class="body">Checks admission AND funding</text><text x="746" y="507" class="body">10 researched · top 5 ranked</text><rect x="1052" y="381" width="274" height="155" rx="15" class="box"/><circle cx="1081" cy="411" r="12" fill="#f5edce"/><text x="1103" y="420" class="name">Leo · writing</text><text x="1075" y="453" class="body">Uses confirmed profile facts</text><text x="1075" y="480" class="body">Tailors one application / SOP</text><text x="1075" y="507" class="body">Missing details stay placeholders</text><path d="M339 458h52M668 458h52M997 458h52" class="line"/><text x="354" y="440" class="label">facts</text><text x="681" y="440" class="label">URLs</text><text x="1008" y="440" class="label">fit</text><path d="M860 536v31H531v-29" class="line" stroke-dasharray="5 4"/><text x="614" y="560" class="label">Retry / search alternatives when a source fails</text><rect x="65" y="620" width="390" height="96" rx="13" fill="#ecf1e9"/><text x="88" y="652" class="name" style="font-size:18px">Real tools, distinct responsibilities</text><text x="88" y="679" class="body">Groq · browser search · Scrapling · GitHub API</text><rect x="505" y="620" width="390" height="96" rx="13" fill="#ecf1e9"/><text x="528" y="652" class="name" style="font-size:18px">Trustworthy output</text><text x="528" y="679" class="body">Source excerpts · dates · eligibility gaps · caveats</text><rect x="945" y="620" width="380" height="96" rx="13" fill="#e2f1e8"/><text x="968" y="652" class="name" style="font-size:18px">A draft, never a submission</text><text x="968" y="679" class="body">The student reviews and chooses the next step.</text><text x="65" y="756" class="label">Each role uses its assigned server-side API key. No invented achievements or scholarships. Research priorities are not admission probabilities.</text></svg>
